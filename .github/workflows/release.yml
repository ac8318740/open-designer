name: Release

# Keep this filename: npm's trusted publisher is bound to release.yml.
# CI stages verified bytes. Only a human npm maintainer can approve publication.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install -g npm@11.19.0
      - name: Check release version and main ancestry
        run: |
          node scripts/sync-version.mjs --check
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            file=./.claude-plugin/plugin.json
            manifest=$(node -p "require('$file').version")
            test "${GITHUB_REF_NAME#v}" = "$manifest"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - run: npm test
      - run: npm run build:viewer
      - run: npm --prefix viewer test -- --run
      - run: npm --prefix viewer exec -- tsc --noEmit -p viewer/tsconfig.json
      - name: Pack and test the release artifact
        id: pack
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          npm run test:packed -- release/*.tgz
          sha256=$(sha256sum release/*.tgz | cut -d ' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error

  stage:
    name: Stage for human npm approval
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'))
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install -g npm@11.19.0
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package
          path: release
      - name: Stage exactly the verified tarball with OIDC
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          shopt -s nullglob
          packages=(./release/*.tgz)
          test "${#packages[@]}" -eq 1
          echo "$EXPECTED_SHA256  ${packages[0]}" | sha256sum --check --strict
          npm stage publish "${packages[0]}" --access public
